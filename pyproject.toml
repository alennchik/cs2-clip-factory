[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cs2-clip-factory"
version = "0.1.0"
description = "Turn permitted Twitch CS2 clips into reviewed 9:16 videos for TikTok."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "click>=8.1",
  "httpx>=0.27",
  "numpy>=1.26",
  "pillow>=10.3",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "yt-dlp>=2025.1.15",
]

[project.optional-dependencies]
# Speech-to-text. faster-whisper works everywhere (CPU on a Mac);
# mlx-whisper is much faster on Apple Silicon.
asr = ["faster-whisper>=1.1"]
mlx = ["mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'"]
# Webcam auto-suggestion in `clipfactory calibrate` (Haar cascades were removed in OpenCV 5).
vision = ["opencv-python-headless>=4.9,<5"]
# ruff is pinned to one minor version so local formatting and CI always agree
dev = ["pytest>=8.0", "ruff>=0.16,<0.17"]

[project.scripts]
clipfactory = "clipfactory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
